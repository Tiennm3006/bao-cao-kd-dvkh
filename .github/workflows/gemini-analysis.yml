name: Analyze weekly workbook with Gemini

on:
  push:
    paths:
      - "*.xlsx"
      - "Prompt-danh-gia-theo-sheet.md"
      - "tools/**"
      - ".github/workflows/gemini-analysis.yml"
  workflow_dispatch:
    inputs:
      current_workbook:
        description: Current weekly workbook path
        required: true
        default: KD-SO LIEU KD-DVKH TUAN 38.xlsx
      previous_workbook:
        description: Previous weekly workbook path
        required: true
        default: KD-SO LIEU KD-DVKH TUAN 37.xlsx
      gemini_model:
        description: Gemini model name
        required: true
        default: gemini-3.6-flash

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare sheet prompts
        run: >-
          python tools/prepare_gemini_analysis.py
          "${{ inputs.current_workbook || 'KD-SO LIEU KD-DVKH TUAN 38.xlsx' }}"
          --previous "${{ inputs.previous_workbook || 'KD-SO LIEU KD-DVKH TUAN 37.xlsx' }}"
          --prompts Prompt-danh-gia-theo-sheet.md
          --output gemini_analysis_requests.json

      - name: Analyze with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model || 'gemini-3.6-flash' }}
        run: >-
          python tools/run_gemini_analysis.py
          gemini_analysis_requests.json
          --output gemini_analysis_results.json

      - name: Upload auditable analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemini-weekly-analysis
          path: |
            gemini_analysis_requests.json
            gemini_analysis_results.json
          retention-days: 30

      - name: Publish analysis results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gemini_analysis_results.json
          git commit -m "data: publish Gemini weekly analysis [skip ci]" || exit 0
          git push
